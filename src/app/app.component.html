<app-header />

<main>
  <ul id="users">
      <li *ngFor="let user of users">
        <app-user [user] = "user" [selected] = "user.id === selectedUserId"(select)="onSelectUser($event)" 
        />
      </li>
  </ul>

  
    <app-tasks *ngIf="selectedUser" [userId] = "selectedUser.id "[name] = "selectedUser.name"  />
  
    <p *ngIf="!selectedUser" id ="fallback">Click on a user to see their tasks!</p>
</main>
